<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>飞机射击小游戏</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b1020;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif;
  }
  canvas {
    background: #050814;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(74, 222, 128, .15);
    max-width: 100vw; max-height: 100vh;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="720"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  let player, bullets, enemies, stars, score, lives, state, enemyTimer, lastTime;
  const keys = {};
  let pointerActive = false;
  let pointerTarget = { x: W / 2, y: H - 80 };

  function init() {
    state = 'playing';
    score = 0;
    lives = 3;
    bullets = [];
    enemies = [];
    enemyTimer = 0;
    player = { x: W / 2 - 17, y: H - 90, w: 34, h: 40, speed: 320, cool: 0 };
    stars = [];
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.4,
        s: 20 + Math.random() * 60
      });
    }
    pointerTarget = { x: player.x + player.w / 2, y: player.y + player.h / 2 };
  }

  function shoot() {
    bullets.push({
      x: player.x + player.w / 2 - 2,
      y: player.y,
      w: 4,
      h: 14,
      speed: 650
    });
  }

  function spawnEnemy() {
    const size = 22 + Math.random() * 20;
    enemies.push({
      x: Math.random() * (W - size),
      y: -size,
      w: size,
      h: size,
      speed: 90 + Math.random() * 90 + score * 0.35
    });
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update(dt) {
    for (const st of stars) {
      st.y += st.s * dt;
      if (st.y > H) {
        st.y = -2;
        st.x = Math.random() * W;
      }
    }

    if (state !== 'playing') return;

    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;

    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      player.x += dx / len * player.speed * dt;
      player.y += dy / len * player.speed * dt;
    }

    if (pointerActive) {
      player.x += (pointerTarget.x - (player.x + player.w / 2)) * Math.min(1, dt * 12);
      player.y += (pointerTarget.y - (player.y + player.h / 2)) * Math.min(1, dt * 12);
    }

    player.x = Math.max(0, Math.min(W - player.w, player.x));
    player.y = Math.max(0, Math.min(H - player.h, player.y));

    player.cool -= dt;
    if ((keys[' '] || pointerActive) && player.cool <= 0) {
      shoot();
      player.cool = 0.16;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y -= b.speed * dt;
      if (b.y + b.h < 0) bullets.splice(i, 1);
    }

    enemyTimer -= dt;
    if (enemyTimer <= 0) {
      spawnEnemy();
      enemyTimer = Math.max(0.22, 0.85 - score / 2500);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.y += e.speed * dt;

      if (e.y > H + 50) {
        enemies.splice(i, 1);
        continue;
      }

      if (rectsOverlap(e, player)) {
        enemies.splice(i, 1);
        lives--;
        if (lives <= 0) state = 'gameover';
        continue;
      }

      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (rectsOverlap(e, b)) {
          enemies.splice(i, 1);
          bullets.splice(j, 1);
          score += 10;
          break;
        }
      }
    }
  }

  function drawPlayer() {
    const { x, y, w, h } = player;
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);

    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.lineTo(w * 0.55, h * 0.15);
    ctx.lineTo(w * 0.28, h * 0.45);
    ctx.lineTo(0, h * 0.25);
    ctx.lineTo(-w * 0.28, h * 0.45);
    ctx.lineTo(-w * 0.55, h * 0.15);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#86efac';
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.55);
    ctx.lineTo(w * 0.18, h * 0.45);
    ctx.lineTo(0, h * 0.3);
    ctx.lineTo(-w * 0.18, h * 0.45);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0ea5e9';
    ctx.beginPath();
    ctx.arc(0, -h * 0.1, w * 0.13, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x + e.w / 2, e.y + e.h / 2);

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(0, e.h / 2);
    ctx.lineTo(e.w * 0.55, -e.h * 0.15);
    ctx.lineTo(e.w * 0.25, -e.h * 0.45);
    ctx.lineTo(0, -e.h * 0.15);
    ctx.lineTo(-e.w * 0.25, -e.h * 0.45);
    ctx.lineTo(-e.w * 0.55, -e.h * 0.15);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fca5a5';
    ctx.beginPath();
    ctx.arc(0, 0, e.w * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#050814');
    g.addColorStop(1, '#0b1020');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for (const st of stars) {
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#fde047';
    for (const b of bullets) {
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }

    for (const e of enemies) drawEnemy(e);

    if (state === 'playing' || state === 'gameover') drawPlayer();

    ctx.fillStyle = '#e5e7eb';
    ctx.font = '16px system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('分数: ' + score, 12, 12);

    ctx.textAlign = 'right';
    ctx.fillText('生命: ' + lives, W - 12, 12);

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(229,231,235,.55)';
    ctx.font = '13px system-ui,sans-serif';
    ctx.fillText('方向键/WASD 移动 · 空格/按住鼠标或触摸射击', W / 2, H - 24);

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,.65)';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 42px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('游戏结束', W / 2, H / 2 - 40);

      ctx.fillStyle = '#e5e7eb';
      ctx.font = '20px system-ui,sans-serif';
      ctx.fillText('得分: ' + score, W / 2, H / 2 + 10);

      ctx.font = '16px system-ui,sans-serif';
      ctx.fillStyle = '#93c5fd';
      ctx.fillText('点击屏幕或按 R 重新开始', W / 2, H / 2 + 55);
    }
  }

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (canvas.width / r.width),
      y: (e.clientY - r.top) * (canvas.height / r.height)
    };
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'gameover') {
      init();
      return;
    }
    pointerActive = true;
    pointerTarget = pointerPos(e);
    canvas.setPointerCapture?.(e.pointerId);
  });

  canvas.addEventListener('pointermove', e => {
    if (!pointerActive) return;
    e.preventDefault();
    pointerTarget = pointerPos(e);
  });

  canvas.addEventListener('pointerup', () => { pointerActive = false; });
  canvas.addEventListener('pointercancel', () => { pointerActive = false; });

  window.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
      e.preventDefault();
    }
    keys[e.key] = true;
    if ((e.key === 'r' || e.key === 'R') && state === 'gameover') init();
  });

  window.addEventListener('keyup', e => { keys[e.key] = false; });

  function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.033);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  init();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
